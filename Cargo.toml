[workspace]
members = [
    "crates/chime-protocol",
    "crates/chime-server",
    "crates/chime-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
include_dir = "0.7.4"
mime_guess = "2.0.5"
p256 = "0.14.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
web-push = "0.11.0"
webauthn-rs = { version = "0.5.5", default-features = false }
