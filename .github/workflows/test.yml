name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build binaries
        run: cargo build --workspace --bins --locked
      - name: Check container and Quadlet configuration
        run: python3 -m unittest discover --start-directory tests/deployment --pattern 'test_*.py'
      - name: Check release configuration and packaging
        run: python3 -m unittest discover --start-directory tests/release --pattern 'test_*.py'
      - name: Build container image
        run: docker build --file Containerfile --tag chime:ci .
